apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 45s
      evaluation_interval: 45s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: alertmanager
        static_configs:
          - targets: ["alertmanager:9093"]
      - job_name: node-exporter
        scrape_interval: 45s
        static_configs:
          - targets: ["node-exporter:9100"]
      - job_name: fail2ban-exporter
        scrape_interval: 60s
        scrape_timeout: 15s
        static_configs:
          - targets: ["fail2ban-exporter:9191"]
      - job_name: pushgateway
        honor_labels: true
        scrape_interval: 30s
        scrape_timeout: 15s
        static_configs:
          - targets: ["pushgateway:9091"]
            labels:
              service_name: foam-proxy
              namespace: monitoring
      - job_name: kubernetes-cadvisor
        scheme: https
        scrape_interval: 90s
        scrape_timeout: 20s
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            action: replace
            target_label: node
        metric_relabel_configs:
          - target_label: origin_prometheus
            replacement: k3s
      - job_name: traefik
        scrape_interval: 45s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: traefik
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: ${1}:9100
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
      - job_name: n8n-main
        scrape_interval: 45s
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - n8n
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: n8n
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: main
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: ${1}:5678
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: service_name
            replacement: n8n-main
      - job_name: n8n-worker
        scrape_interval: 45s
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - n8n
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            action: keep
            regex: n8n
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: worker
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: ${1}:5678
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: service_name
            replacement: n8n-worker
  alerts.yml: |
    groups:
      - name: applications_in_cluster
        rules:
          - alert: N8NMainDown
            expr: up{job="n8n-main"} == 0
            for: 5m
            labels:
              severity: critical
              service: n8n
            annotations:
              summary: "n8n main metrics target is down"
              description: "Prometheus cannot scrape n8n main on /metrics in the cluster."
          - alert: N8NWorkerDown
            expr: sum(up{job="n8n-worker"}) < 1
            for: 5m
            labels:
              severity: warning
              service: n8n
            annotations:
              summary: "n8n worker metrics target is down"
              description: "Prometheus cannot scrape any n8n worker on /metrics in the cluster."

      - name: monitoring_infrastructure
        rules:
          - alert: InfrastructureTargetDown
            expr: up{job=~"prometheus|alertmanager|node-exporter|traefik"} == 0
            for: 5m
            labels:
              severity: warning
              service: infrastructure
            annotations:
              summary: "{{ $labels.job }} is not responding to scrape"
              description: "Monitoring target {{ $labels.job }} has up==0 for at least 5m."
