apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboard-apps
    files:
      - dashboards/foam-proxy-overview.json
      - dashboards/now-playing-overview.json
      - dashboards/document-automation-overview.json
  - name: grafana-dashboard-infra
    files:
      - dashboards/traefik-prometheus.json
      - dashboards/server-security-signals.json
resources:
  - namespace.yaml
  - pvc-prometheus.yaml
  - pvc-grafana.yaml
  - pvc-alertmanager.yaml
  - pvc-loki.yaml
  - prometheus-rbac.yaml
  - prometheus-config.yaml
  - prometheus.yaml
  - prometheus-service.yaml
  - node-exporter.yaml
  - fail2ban-exporter.yaml
  - alertmanager-config.yaml
  - alertmanager.yaml
  - alertmanager-service.yaml
  - loki-config.yaml
  - loki.yaml
  - promtail.yaml
  - pushgateway.yaml
  - grafana-datasource.yaml
  - grafana-dashboard-providers.yaml
  - grafana.yaml
  - grafana-service.yaml
  - ingress-grafana.yaml
  - ingress-prometheus.yaml
  - middleware-prometheus-auth.yaml
  - middleware-pushgateway-auth.yaml
  - ingress-pushgateway.yaml
  - middleware-alertmanager-auth.yaml
  - ingress-alertmanager.yaml
