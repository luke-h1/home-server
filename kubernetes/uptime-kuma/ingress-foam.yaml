apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma-foam
  namespace: uptime-kuma
spec:
  ingressClassName: traefik
  rules:
    - host: "${UPTIME_FOAM_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma-foam
                port:
                  number: 3001
